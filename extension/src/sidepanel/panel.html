<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unnepo</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <div class="top-text">
      <div class="logo-row"><div class="logo">unnepo<span class="dot">.</span></div><span id="plan-badge"></span></div>
      <p class="ticker mono" id="ticker-line"><span id="typed" aria-hidden="true"></span><span id="untyped" class="untyped" aria-hidden="true"></span><span id="said" class="sr-only" aria-live="polite"></span></p>
    </div>
    <button type="button" class="spider" id="spider" aria-label="Poke the spider"><span class="thread"></span></button>
  </header>

  <main id="app" class="body"></main>
  <input type="file" id="resume-input" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  <input type="file" id="my-letter-input" accept=".pdf,.docx,.doc,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  <input type="file" id="transcript-input" accept=".pdf,.docx,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

  <section id="password" class="password" aria-label="Job-site password" hidden></section>

  <!-- Game mode's daily boss: a small popup above the tabs (boss.ts). -->
  <div id="boss" class="boss-slot"></div>

  <!-- The menu, along the bottom: Home (the tools, with the graph under them), Jobs (every job; a job's people are a tap in) and Me. -->
  <nav id="tabs" class="tabs" aria-label="Sections" hidden>
    <button type="button" class="tab" data-tab="jobs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span class="tab-count" id="home-count" hidden></span>Home</button>
    <button type="button" class="tab" data-tab="tools"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M17.25 13.5v7.5M13.5 17.25H21"/></svg>Tools</button>
    <button type="button" class="tab" data-tab="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg><span class="tab-count" id="jobs-count" hidden></span>Jobs</button>
    <button type="button" class="tab" data-tab="follow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg><span class="tab-count" id="follow-count" hidden></span><span class="tab-demo" aria-hidden="true">Demo</span>Scan email<span class="sr-only"> (demo)</span></button>
    <button type="button" class="tab" data-tab="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
  </nav>

  <script type="module" src="panel.js"></script>
</body>
</html>
