<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unnepo</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <div class="top-text">
      <div class="logo">unnepo<span class="dot">.</span></div>
      <p class="ticker mono" id="ticker-line"><span id="typed" aria-hidden="true"></span><span id="said" class="sr-only" aria-live="polite"></span></p>
    </div>
    <div class="spider" id="spider" aria-hidden="true"><div class="thread"></div></div>
  </header>

  <main id="app" class="body"></main>
  <input type="file" id="resume-input" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

  <section id="password" class="password" aria-label="Job-site password" hidden></section>

  <nav id="dock" class="dock" aria-label="Dashboard and settings" hidden>
    <a id="dashboard" target="_blank" rel="noreferrer">See my job dashboard <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
    <button type="button" id="open-settings">Settings</button>
  </nav>

  <script type="module" src="panel.js"></script>
</body>
</html>
