<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unnepo</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <span class="logo">unnepo<span class="dot">.</span></span>
    <span id="account" class="mono email"></span>
  </header>

  <section id="speech" class="speech" aria-label="Unnepo says">
    <div class="spider bob" id="spider"><div class="thread"></div></div>
    <div class="bubble-wrap">
      <span class="nametag">UNNEPO</span>
      <button type="button" class="bubble" id="bubble" aria-label="Next line">
        <span id="typed" aria-hidden="true"></span>
        <span id="said" class="sr-only" aria-live="polite"></span>
        <span id="more" class="more blink" aria-hidden="true" hidden></span>
      </button>
    </div>
  </section>

  <main id="app"></main>
  <input type="file" id="resume-input" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

  <section id="password" class="password" aria-label="Job-site password" hidden></section>

  <footer id="footer" class="foot" hidden>
    <button type="button" id="disconnect" class="quiet">Sign out</button>
    <span id="version" class="mono"></span>
  </footer>

  <nav id="menu" class="menu" aria-label="Menu" hidden>
    <button type="button" data-view="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"></path></svg>
      <span>Apply</span>
    </button>
    <button type="button" data-view="jobs">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path><path d="M3 13h18"></path></svg>
      <span>My jobs</span>
    </button>
    <button type="button" data-view="profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      <span>Profile</span>
    </button>
    <button type="button" data-view="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      <span>Settings</span>
    </button>
  </nav>

  <script type="module" src="panel.js"></script>
</body>
</html>
