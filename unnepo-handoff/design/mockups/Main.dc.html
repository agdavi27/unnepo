<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unnepo home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;family=Press+Start+2P&amp;display=swap">
<style>
body{margin:0;background:#070708}
a{color:#F7F7F8}a:hover{color:#FFFFFF}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.bob{animation:bob 3.2s steps(4) infinite}
.blink{animation:blink 0.9s steps(1) infinite}
.cta:hover{transform:translate(2px,2px);box-shadow:4px 4px 0 #3D8BFF}
.cta:active{transform:translate(6px,6px);box-shadow:0 0 0 #3D8BFF}
.dlg:focus-visible{outline:3px solid #3D8BFF;outline-offset:10px}
@media (prefers-reduced-motion: reduce){.bob,.blink{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 900px; box-sizing: border-box; background: #070708; color: #F7F7F8; font-family: Geist, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

<header style="position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 24px 40px">
<a href="#" style="font-size: 20px; font-weight: 700; letter-spacing: -0.6px; text-decoration: none; color: #F7F7F8">unnepo<span style="color: {{accent}}">.</span></a>
<nav aria-label="Main" style="display: flex; align-items: center; gap: 28px; font-size: 14px">
<a href="#" style="color: #9A9AA3; text-decoration: none">Pricing</a>
<a href="#" style="color: #9A9AA3; text-decoration: none; padding: 12px 0">Log in</a>
</nav>
</header>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 36px; padding: 8px 24px 64px">
<h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0">Unnepo: you pick the jobs, we do the crawling</h1>

<div class="bob" aria-hidden="true" style="position: relative; width: min(400px, 82vw)">
<div style="position: absolute; left: calc(50% - 3px); bottom: calc(100% - 18px); width: 6px; height: 900px; background: #3A3A44"></div>
<div style="position: relative; display: grid; grid-template-columns: repeat(40, minmax(0, 1fr))">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="40">
<div style="aspect-ratio: 1 / 1; background: {{c.bg}}"></div>
</sc-for>
</div>
</div>

<div style="width: 100%; max-width: 760px; display: flex; flex-direction: column">
<div style="align-self: flex-start; margin-left: 24px; position: relative; z-index: 1; background: {{accent}}; color: #FFFFFF; font-family: 'Press Start 2P', monospace; font-size: 13px; padding: 10px 14px 8px; border: 4px solid #070708; box-shadow: 0 0 0 4px #F7F7F8; margin-bottom: -8px">UNNEPO</div>
<button type="button" class="dlg" onClick="{{advance}}" aria-label="Next line" style="position: relative; text-align: left; cursor: pointer; background: #F7F7F8; color: #070708; border: 4px solid #070708; box-shadow: 0 0 0 4px #F7F7F8, 12px 12px 0 4px #1E1E26; padding: 30px 32px 34px; min-height: 150px; font-family: 'Press Start 2P', monospace; font-size: clamp(13px, 1.7vw, 17px); line-height: 2">
<span aria-hidden="true">{{typed}}</span>
<span aria-live="polite" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{full}}</span>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<span class="blink" aria-hidden="true" style="position: absolute; right: 22px; bottom: 16px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #070708"></span>
</sc-if>
</button>
<div aria-hidden="true" style="display: flex; justify-content: center; gap: 8px; margin-top: 28px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<span style="width: 8px; height: 8px; background: {{d.bg}}"></span>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<a href="#" class="cta" style="display: inline-flex; align-items: center; gap: 14px; background: #F7F7F8; color: #070708; text-decoration: none; font-family: 'Press Start 2P', monospace; font-size: 14px; line-height: 1.6; padding: 18px 26px; border: 4px solid #070708; box-shadow: 6px 6px 0 {{accent}}; min-height: 48px; box-sizing: border-box">Add to Chrome — it's free for students</a>
<p style="margin: 0; font-size: 13px; color: #8B8B94; text-align: center">Works on Greenhouse, Lever, Ashby, Workday and more.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3D8BFF","options":["#3D8BFF","#F7F7F8","#B48FAE"]},"$preview":{"width":1440,"height":900}}'>
var LINES = [
  "Applying to internships is brutal. Same resume, retyped into 200 forms.",
  "Then Workday wants a new account. For every. Single. Company.",
  "So I crawl them for you. Every field, every dropdown, every Next button.",
  "I make the accounts, hit submit, and log it the second it lands.",
  "Then I find the recruiters behind the role and write the email.",
  "Your job? Pick the jobs. I'll do the crawling."
];

function buildSpider(open) {
  var W = 40, H = 30;
  var g = [];
  for (var y = 0; y < H; y++) { g.push([]); for (var x = 0; x < W; x++) g[y].push(0); }
  function set(x, y, c) { if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c; }
  function brush(x, y, c) { set(x, y, c); set(x + 1, y, c); set(x, y + 1, c); set(x + 1, y + 1, c); }
  function line(x0, y0, x1, y1, c) {
    var dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
    for (;;) {
      brush(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  var legs = [
    [[13, 10], [7, 4], [3, 13]],
    [[12, 13], [5, 9], [1, 19]],
    [[12, 16], [5, 15], [2, 24]],
    [[14, 19], [9, 21], [6, 27]]
  ];
  legs.forEach(function (L) {
    [0, 1].forEach(function (side) {
      var m = function (p) { return side ? [W - 2 - p[0], p[1]] : p; };
      var a = m(L[0]), k = m(L[1]), f = m(L[2]);
      line(a[0], a[1], k[0], k[1], 'l');
      line(k[0], k[1], f[0], f[1], 'L');
      set(k[0] + (side ? 1 : 0), k[1], 'h');
    });
  });
  function blob(cx, cy, rx, ry, base, hi, lo) {
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
      if (nx * nx + ny * ny <= 1) {
        var c = base;
        if (nx < -0.25 && ny < -0.3) c = hi;
        else if (ny > 0.55 || nx > 0.6) c = lo;
        g[y][x] = c;
      }
    }
  }
  blob(20, 9, 8.6, 7.2, 'b', 'h', 'd');
  set(17, 4, 'w'); set(18, 4, 'h');
  [[19, 7], [20, 7], [18, 8], [21, 8], [19, 9], [20, 9], [19, 10], [20, 10]].forEach(function (p) { set(p[0], p[1], 'a'); });
  blob(20, 17.8, 6.8, 5.2, 'k', 'h', 'K');
  [[16, 15], [17, 15], [16, 16], [17, 16], [22, 15], [23, 15], [22, 16], [23, 16]].forEach(function (p) { set(p[0], p[1], 'e'); });
  set(16, 15, 'w'); set(22, 15, 'w');
  set(14, 14, 'e'); set(25, 14, 'e');
  if (open) {
    for (var x1 = 17; x1 <= 22; x1++) { set(x1, 19, 'm'); set(x1, 20, 'm'); }
    for (var x2 = 18; x2 <= 21; x2++) set(x2, 21, 'm');
    set(19, 21, 'p'); set(20, 21, 'p');
    set(18, 19, 'f'); set(18, 20, 'f'); set(21, 19, 'f'); set(21, 20, 'f');
  } else {
    for (var x3 = 18; x3 <= 21; x3++) set(x3, 20, 'm');
    set(18, 21, 'f'); set(21, 21, 'f');
  }
  var out = g.map(function (r) { return r.slice(); });
  for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) {
    if (g[yy][xx]) continue;
    var n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (d) {
      var X = xx + d[0], Y = yy + d[1];
      return X >= 0 && X < W && Y >= 0 && Y < H && g[Y][X];
    });
    if (n) out[yy][xx] = 'o';
  }
  var flat = [];
  out.forEach(function (r) { r.forEach(function (c) { flat.push(c); }); });
  return flat;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { line: 0, n: 0, hold: 0 };
    this._open = buildSpider(true);
    this._closed = buildSpider(false);
  }
  componentDidMount() {
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    this.reduce = reduce;
    if (reduce) { this.setState({ n: LINES[0].length }); return; }
    this.timer = setInterval(() => this.tick(), 42);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    var s = this.state, L = LINES[s.line];
    if (s.n < L.length) { this.setState({ n: s.n + 1 }); return; }
    if (s.hold < 60) { this.setState({ hold: s.hold + 1 }); return; }
    this.next();
  }
  next() {
    var nl = (this.state.line + 1) % LINES.length;
    this.setState({ line: nl, n: this.reduce ? LINES[nl].length : 0, hold: 0 });
  }
  renderVals() {
    var accent = this.props.accent ?? '#3D8BFF';
    var s = this.state, L = LINES[s.line];
    var typing = s.n < L.length;
    var ch = L.charAt(s.n);
    var open = typing && ch !== ' ' && Math.floor(s.n / 2) % 2 === 0;
    var pal = { o: '#000000', b: '#6E5B6E', h: '#B48FAE', d: '#4E3549', a: accent, k: '#7E6580', K: '#5A4258', l: '#6E5B6E', L: '#4E3549', e: accent, w: '#FFFFFF', m: '#1A0E14', f: '#F7F7F8', p: '#965E8C' };
    var map = open ? this._open : this._closed;
    var self = this;
    return {
      accent: accent,
      cells: map.map(function (c) { return { bg: c ? pal[c] : 'transparent' }; }),
      typed: L.slice(0, s.n),
      full: L,
      done: !typing,
      dots: LINES.map(function (_, i) { return { bg: i === s.line ? accent : '#2A2A31' }; }),
      advance: function () {
        if (self.state.n < LINES[self.state.line].length) self.setState({ n: LINES[self.state.line].length, hold: 0 });
        else self.next();
      }
    };
  }
}
</script>
</body>
</html>
